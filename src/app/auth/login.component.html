<main class="login">
  <section class="panel" aria-label="Acceso al sistema Matrix">
    <span class="hud-corner hud-tl" aria-hidden="true"></span>
    <span class="hud-corner hud-br" aria-hidden="true"></span>

    <div class="kicker m-mono">// PROTOCOLO DE ACCESO · DSY1107</div>
    <h1 class="login-title m-mono">ENTER THE MATRIX</h1>
    <p class="muted m-mono">SISTEMA CLOUD NATIVE · ENTRA ID</p>

    @if (yaAutenticado) {
      <p class="auth-ok m-mono"><i class="dot dot-ok"></i> SESIÓN ACTIVA · JWT VERIFICADO</p>
      <button type="button" class="matrix-login-btn m-mono" (click)="irACartas()">
        ENTRAR A LA MATRIX ▶
      </button>
    } @else {
      <button type="button" class="matrix-login-btn m-mono" (click)="login()" [disabled]="!configurado">
        <span class="ms" aria-hidden="true">
          <span class="sq s1"></span><span class="sq s2"></span><span class="sq s3"></span><span class="sq s4"></span>
        </span>
        CONTINUAR CON MICROSOFT
      </button>
      <p class="tiny m-mono">Autenticación segura con Microsoft Entra ID (OAuth 2.0 / OIDC)</p>
    }

    @if (!configurado) {
      <p class="warn tiny m-mono">Falta Tenant ID y Client IDs en environment.ts</p>
    }
  </section>
</main>
