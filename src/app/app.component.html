<!-- Lluvia de código Matrix global (montada una sola vez, persiste entre pestañas) -->
<app-matrix-rain [activeBrokerIds]="activeBrokerIds"></app-matrix-rain>

@if (esLogin) {
  <div class="matrix-shell">
    <router-outlet />
  </div>
} @else {
  <div class="matrix-shell">
    <!-- Header minimalista fijo -->
    <header class="matrix-header" role="banner">
      <div class="matrix-header-inner">
        <div class="matrix-brand" (click)="irATab('mochila')" role="button" tabindex="0" aria-label="Ir al inicio">
          <span class="m-dot" [class.m-dot-warn]="brokersOnlineCount === 2" [class.m-dot-danger]="brokersOnlineCount < 2"></span>
          <div class="matrix-brand-text">
            <span class="matrix-logo m-display">MATRIX <strong>VAULT</strong></span>
            <span class="matrix-sub m-mono">CLOUD NATIVE // 44.195.35.138</span>
          </div>
        </div>

        <!-- 4 Pestañas claras con atajos 1-4 -->
        <nav class="matrix-nav" aria-label="Navegación principal">
          <button type="button" class="matrix-nav-btn" [class.active]="currentTab === 'mochila'" (click)="irATab('mochila')">
            <span class="m-key">1</span> CATÁLOGO / ÓRDENES
          </button>
          <button type="button" class="matrix-nav-btn" [class.active]="currentTab === 'kafka'" (click)="irATab('kafka')">
            <span class="m-key">2</span> CLÚSTER KAFKA
            <span class="m-pill" [class.warn]="brokersOnlineCount === 2" [class.danger]="brokersOnlineCount < 2">{{ brokersOnlineCount }}/3</span>
          </button>
          <button type="button" class="matrix-nav-btn" [class.active]="currentTab === 'rabbitmq'" (click)="irATab('rabbitmq')">
            <span class="m-key">3</span> RABBITMQ
          </button>
          <button type="button" class="matrix-nav-btn" [class.active]="currentTab === 'entrenador'" (click)="irATab('entrenador')">
            <span class="m-key">4</span> SISTEMA AWS / JWT
          </button>
        </nav>

        <!-- Telemetría global y saldo -->
        <div class="matrix-status-bar">
          <div class="m-badge" [class.m-badge-warn]="brokersOnlineCount === 2" [class.m-badge-danger]="brokersOnlineCount < 2" title="Estado del clúster Apache Kafka">
            <span class="m-dot" [class.m-dot-warn]="brokersOnlineCount === 2" [class.m-dot-danger]="brokersOnlineCount < 2"></span>
            ISR {{ brokersOnlineCount }}/3
          </div>

          <div class="matrix-wallet">
            <span class="m-mono wallet-amount">{{ formatPokedollars(balance) }}</span>
            <button type="button" class="m-btn m-btn-sm" (click)="recargarBalance()" title="Recargar saldo">+50K</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido principal por encima del canvas -->
    <main class="matrix-main" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Notificaciones flotantes (Toasts) -->
  <div class="matrix-toast-container" aria-live="polite">
    @for (toast of notificationService.toasts$ | async; track toast.id) {
      <div class="matrix-toast" [class.success]="toast.type === 'success'" [class.error]="toast.type === 'error'" [class.info]="toast.type === 'info'">
        <span class="matrix-toast-msg">{{ toast.message }}</span>
        <button type="button" class="m-btn m-btn-sm" (click)="notificationService.dismissToast(toast.id)" aria-label="Cerrar notificación">×</button>
      </div>
    }
  </div>
}
