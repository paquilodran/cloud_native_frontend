@if (esLogin) {
  <router-outlet />
} @else {
  <!-- ========================================================================= -->
  <!-- CARCASA DE CONSOLA GAME BOY ADVANCE (GBA CLOUD-NATIVE EDITION)           -->
  <!-- ========================================================================= -->
  <div class="gba-outer-container">
    <div class="gba-console-wrapper" [class.gba-shell-indigo]="shellTheme === 'INDIGO'" [class.gba-shell-dmg]="shellTheme === 'DMG'">
      
      <!-- Botones Superiores L y R (Shoulder Bumpers) -->
      <div class="gba-bumpers-bar">
        <button type="button" class="gba-bumper-btn" (click)="prevTab()" title="Botón L (Tecla L o Pág. Anterior)">
          [ L ] PREV TAB
        </button>
        <div class="gba-bumper-speaker">
          <span>::::</span>
          <span class="font-pixel" style="font-size: 8px; color: #E2E8F0; margin: 0 8px;">NINTENDO GBA CONSOLE</span>
          <span>::::</span>
        </div>
        <button type="button" class="gba-bumper-btn" (click)="nextTab()" title="Botón R (Tecla R o Pág. Siguiente)">
          NEXT TAB [ R ]
        </button>
      </div>

      <!-- Barra de Encabezado Pokédex Superior -->
      <header class="gba-pokedex-header">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <div class="pokedex-led" title="Pokédex Power ON"></div>
          <div>
            <h1 class="font-pixel" style="font-size: 13px; margin: 0; color: #F8D030; text-shadow: 2px 2px 0 #000;">
              POKéVAULT TCG
            </h1>
            <span class="font-silk" style="font-size: 8px; color: #CBD5E1;">
              CLOUD-NATIVE GBA • AWS EC2 13.221.177.55
            </span>
          </div>
        </div>

        <!-- Telemetría & Perfil de Entrenador -->
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <!-- Saldo en Poké-dólares -->
          <div class="gba-wallet-box">
            <span class="font-pixel" style="font-size: 10px; color: #F8D030;">{{ formatPokedollars(balance) }}</span>
            <button type="button" class="gba-mini-btn" (click)="recargarBalance()" title="Recargar saldo">+₽50K</button>
          </div>

          <!-- Selector de Carcasa GBA / DMG -->
          <button type="button" class="gba-mini-btn" (click)="toggleShellTheme()" title="Cambiar color de carcasa">
            {{ shellTheme === 'INDIGO' ? '🎨 INDIGO' : '🎨 GB DMG' }}
          </button>

          <!-- Ficha de Entrenador -->
          <div class="gba-trainer-chip" (click)="irATab('entrenador')">
            <span class="font-pixel" style="font-size: 9px; color: #A3E635;">TRN: PATRICIO &amp; SEBASTIAN</span>
          </div>
        </div>
      </header>

      <!-- Pantalla CRT LCD de la Consola GBA -->
      <main class="gba-screen-bezel">
        <div class="gba-screen-content scanlines" style="padding: 16px;">
          <router-outlet></router-outlet>
        </div>
      </main>

      <!-- Controles Inferiores GBA (Decorativos / Interactivos) -->
      <footer class="gba-controls-footer">
        <!-- D-Pad -->
        <div class="gba-dpad">
          <div class="dpad-up" (click)="prevTab()">▲</div>
          <div class="dpad-left" (click)="prevTab()">◀</div>
          <div class="dpad-center"></div>
          <div class="dpad-right" (click)="nextTab()">▶</div>
          <div class="dpad-down" (click)="nextTab()">▼</div>
        </div>

        <!-- Botones Select y Start -->
        <div class="gba-start-select">
          <div class="btn-pill" (click)="irATab('mochila')">
            <span></span>
            <label class="font-pixel" style="font-size: 7px; color: #CBD5E1;">SELECT</label>
          </div>
          <div class="btn-pill" (click)="irATab('kafka')">
            <span></span>
            <label class="font-pixel" style="font-size: 7px; color: #CBD5E1;">START</label>
          </div>
        </div>

        <!-- Botones B y A de Nintendo -->
        <div class="gba-ab-buttons">
          <div class="action-btn" (click)="prevTab()">
            <span class="font-pixel" style="font-size: 10px; color: #FFF;">B</span>
          </div>
          <div class="action-btn" (click)="nextTab()">
            <span class="font-pixel" style="font-size: 10px; color: #FFF;">A</span>
          </div>
        </div>
      </footer>

    </div>
  </div>
}
