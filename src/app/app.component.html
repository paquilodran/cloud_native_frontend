@if (esLogin) {
  <app-matrix-rain [activeBrokerIds]="activeBrokerIds" />
  <div class="matrix-shell">
    <router-outlet />
  </div>
} @else {
  <!-- Lluvia de código Matrix global (persiste entre las 4 pestañas) -->
  <app-matrix-rain [activeBrokerIds]="activeBrokerIds" />

  <div class="matrix-shell">
    <!-- Header minimalista fijo estilo "Enter the MATRIX" -->
    <header class="matrix-header" role="banner">
      <div class="matrix-header-inner">
        <div class="matrix-brand" (click)="irATab('mochila')" role="button" tabindex="0" (keydown.enter)="irATab('mochila')">
          <span class="matrix-logo-mark" aria-hidden="true">M</span>
          <div class="matrix-brand-text">
            <span class="matrix-brand-title">MATRIX CLOUD</span>
            <span class="matrix-brand-sub m-mono">DISTRIBUTED STREAMING // AWS EC2</span>
          </div>
        </div>

        <!-- 4 Pestañas principales (atajos 1-4) -->
        <nav class="matrix-nav" aria-label="Navegación principal">
          <button type="button" class="matrix-nav-tab" [class.active]="currentTab === 'mochila'" (click)="irATab('mochila')">
            <span class="tab-key">1</span>
            <span>INICIO / TICKETS</span>
          </button>
          <button type="button" class="matrix-nav-tab" [class.active]="currentTab === 'kafka'" (click)="irATab('kafka')">
            <span class="tab-key">2</span>
            <span>CLÚSTER KAFKA</span>
          </button>
          <button type="button" class="matrix-nav-tab" [class.active]="currentTab === 'rabbitmq'" (click)="irATab('rabbitmq')">
            <span class="tab-key">3</span>
            <span>RABBITMQ</span>
          </button>
          <button type="button" class="matrix-nav-tab" [class.active]="currentTab === 'entrenador'" (click)="irATab('entrenador')">
            <span class="tab-key">4</span>
            <span>SISTEMA AWS / JWT</span>
          </button>
        </nav>

        <!-- Telemetría global y saldo -->
        <div class="matrix-header-meta">
          <button type="button" class="matrix-status-pill"
                  [class.warn]="brokersOnlineCount === 2"
                  [class.danger]="brokersOnlineCount < 2"
                  (click)="irATab('kafka')"
                  title="Estado de los 3 brokers Kafka">
            <span class="m-dot" [class.m-dot-warn]="brokersOnlineCount === 2" [class.m-dot-danger]="brokersOnlineCount < 2"></span>
            <span class="m-mono">{{ brokersOnlineCount }}/3 ISR</span>
          </button>

          <div class="matrix-wallet">
            <span class="m-mono wallet-amount">{{ formatCredits(balance) }}</span>
            <button type="button" class="m-btn m-btn-sm" (click)="recargarBalance()" title="Recargar crédito">
              +50K
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido principal por encima del canvas -->
    <main class="matrix-main" role="main">
      <router-outlet />
    </main>
  </div>

  <!-- Notificaciones flotantes (Toasts) -->
  <div class="matrix-toast-stack" role="status" aria-live="polite">
    @for (toast of notificationService.toasts$ | async; track toast.id) {
      <div class="matrix-toast" [class.toast-error]="toast.type === 'error'" [class.toast-info]="toast.type === 'info'">
        <span class="toast-msg">{{ toast.message }}</span>
        <button type="button" class="toast-close" (click)="notificationService.dismissToast(toast.id)" aria-label="Cerrar notificación">
          ✕
        </button>
      </div>
    }
  </div>
}
